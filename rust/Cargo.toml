[package]
name = "estudohtmx-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
askama = "0.12"
askama_axum = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
evalexpr = "11"
serde = { version = "1", features = ["derive"] }
serde_urlencoded = "0.7"
tower = "0.5"

[profile.dev]
opt-level = 0
