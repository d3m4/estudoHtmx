<form id="expense-form"
      hx-post="/expenses"
      hx-target="#expense-form"
      hx-swap="outerHTML"
      {% if oob %}hx-swap-oob="true"{% endif %}>
  <input type="hidden" name="id" value="{% if let Some(id) = id %}{{ id }}{% endif %}">

  <label for="nome">nome
    <input id="nome" name="nome" type="text" value="{{ nome }}"
           aria-invalid="{% if error_nome.is_some() %}true{% else %}false{% endif %}">
    {% if let Some(e) = error_nome %}<small class="error">{{ e }}</small>{% endif %}
  </label>

  <label for="valor">valor
    <input id="valor" name="valor" type="text" value="{{ valor }}"
           aria-invalid="{% if error_valor.is_some() %}true{% else %}false{% endif %}">
    <small class="hint">ex: 100, -50, 1234,56 ou =(50/2)+10</small>
    {% if let Some(e) = error_valor %}<small class="error">{{ e }}</small>{% endif %}
  </label>

  <label for="total_acumulado">total acumulado
    <input id="total_acumulado" name="total_acumulado" type="text" readonly
           value="{{ total_acumulado_fmt }}"
           hx-get="/expenses/total-context?excluding_id={% if let Some(id) = id %}{{ id }}{% endif %}"
           hx-trigger="focusout from:#expense-form input delay:300ms, focusout from:#expense-form textarea delay:300ms"
           hx-target="this"
           hx-swap="outerHTML">
  </label>

  <label for="descricao">descricao
    <textarea id="descricao" name="descricao" rows="2">{{ descricao }}</textarea>
  </label>

  <div role="group">
    <button type="submit">salvar</button>
    <button type="button" class="secondary"
            hx-get="/expenses/form"
            hx-target="#expense-form"
            hx-swap="outerHTML">cancelar</button>
  </div>
</form>
